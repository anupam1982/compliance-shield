name: Expire Overrides

on:
  schedule:
    - cron: "0 2 * * *"

jobs:
  expire:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: node lib/scripts/expireOverrides.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}